spring.application.name=findsure-backend

# --- Database (MySQL) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/findsure?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Override in production via env var — never commit a real secret.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# --- App ---
app.qr.base-url=${QR_BASE_URL:https://findsure.com}

server.port=${PORT:8080}
